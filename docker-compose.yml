version: '3.8'

services:
  # 后端API服务 (开发环境)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servertracker-backend-dev
    # 开发环境暴露端口到宿主机
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/data/monitor.db}
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-True}
    # 代码映射，支持热重载
    volumes:
      - ./backend:/app
      - servertracker_data:/app/data
    networks:
      - servertracker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # 开发环境使用开发模式启动
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # 前端服务 (开发环境)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: servertracker-frontend-dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000
    # 代码映射，支持热重载
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - servertracker-network
    restart: unless-stopped
    stdin_open: true
    tty: true

  # 探针服务 (可选，用于开发测试)
  probe:
    build:
      context: ./probe
      dockerfile: Dockerfile
    container_name: servertracker-probe-dev
    environment:
      - API_BASE_URL=http://backend:8000
      - PROBE_INTERVAL=${PROBE_INTERVAL:-30}
    volumes:
      - ./probe:/app
    networks:
      - servertracker-network
    restart: unless-stopped

  # Redis缓存 (开发环境可选)
  # redis:
  #   image: redis:7-alpine
  #   container_name: servertracker-redis-dev
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - servertracker-network
  #   restart: unless-stopped

  # SQLite数据库容器 (开发环境)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: servertracker-postgres-dev
  #   environment:
  #     POSTGRES_DB: servertracker
  #     POSTGRES_USER: ${POSTGRES_USER:-admin}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
  #   volumes:
  #     - postgres_data_dev:/var/lib/postgresql/data
  #   networks:
  #     - servertracker-network
  #   restart: unless-stopped

# 网络配置
networks:
  servertracker-network:
    driver: bridge

# 数据卷
volumes:
  servertracker_data: